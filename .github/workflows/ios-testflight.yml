name: iOS TestFlight Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'

jobs:
  build-and-deploy:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup iOS credentials files
        working-directory: apps/mobile
        run: |
          echo "${{ secrets.DISTRIBUTION_P12_BASE64 }}" | base64 --decode > distribution.p12
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > distribution.mobileprovision
          cat > credentials.json << 'CREDS'
          {
            "ios": {
              "distributionCertificate": {
                "path": "distribution.p12",
                "password": "${{ secrets.P12_PASSWORD }}"
              },
              "provisioningProfilePath": "distribution.mobileprovision"
            }
          }
          CREDS

      - name: Build iOS with EAS (local credentials)
        working-directory: apps/mobile
        env:
          API_URL: https://app-taixe.onrender.com
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          eas build \
            --platform ios \
            --profile ios-testflight \
            --non-interactive \
            --wait \
            --local \
            --output /tmp/app.ipa

      - name: Setup ASC API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Upload to TestFlight
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file /tmp/app.ipa \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" \
            --verbose
