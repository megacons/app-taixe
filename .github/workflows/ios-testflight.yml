name: iOS TestFlight Deploy

on:
  workflow_dispatch:  # Chạy thủ công từ GitHub Actions tab
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'  # Chỉ chạy khi có thay đổi trong mobile app

jobs:
  deploy-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup iOS credentials
        working-directory: apps/mobile
        run: |
          echo "${{ secrets.DISTRIBUTION_P12_BASE64 }}" | base64 --decode > distribution.p12
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > distribution.mobileprovision

      - name: Update credentials.json
        working-directory: apps/mobile
        run: |
          cat > credentials.json << EOF
          {
            "ios": {
              "distributionCertificate": {
                "path": "distribution.p12",
                "password": "${{ secrets.P12_PASSWORD }}"
              },
              "provisioningProfilePath": "distribution.mobileprovision"
            }
          }
          EOF

      - name: Build iOS with EAS
        working-directory: apps/mobile
        env:
          API_URL: https://app-taixe.onrender.com
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          eas build --platform ios --profile ios-testflight --non-interactive --wait
          echo "EAS Build completed"

      - name: Get IPA download URL
        id: get_ipa
        working-directory: apps/mobile
        run: |
          BUILD_INFO=$(eas build:list --platform ios --status finished --limit 1 --json --non-interactive 2>/dev/null)
          BUILD_URL=$(echo "$BUILD_INFO" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data[0]['artifacts']['buildUrl'])" 2>/dev/null)
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
          echo "IPA URL: $BUILD_URL"

      - name: Download IPA
        run: |
          curl -L "${{ steps.get_ipa.outputs.build_url }}" -o app.ipa
          echo "IPA downloaded: $(ls -lh app.ipa)"

      - name: Setup ASC API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Upload to TestFlight via xcrun altool
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file app.ipa \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" \
            --verbose
