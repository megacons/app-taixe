name: iOS TestFlight Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'

jobs:
  deploy-ios:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Expo CLI globally
        run: npm install -g @expo/cli

      - name: Setup iOS credentials
        working-directory: apps/mobile
        run: |
          # Decode distribution certificate
          echo "${{ secrets.DISTRIBUTION_P12_BASE64 }}" | base64 --decode > distribution.p12
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > distribution.mobileprovision

      - name: Install certificate and provisioning profile
        run: |
          # Create keychain
          security create-keychain -p "build_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "build_password" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import certificate
          security import apps/mobile/distribution.p12 \
            -k build.keychain \
            -P "${{ secrets.P12_PASSWORD }}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "build_password" build.keychain

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp apps/mobile/distribution.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          # Get UUID of provisioning profile
          PP_UUID=$(security cms -D -i apps/mobile/distribution.mobileprovision | plutil -extract UUID raw -)
          echo "Provisioning Profile UUID: $PP_UUID"
          echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV

      - name: Export Expo app to Xcode project
        working-directory: apps/mobile
        env:
          API_URL: https://app-taixe.onrender.com
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          npx expo prebuild --platform ios --clean

      - name: Get Team ID and Bundle ID from provisioning profile
        run: |
          TEAM_ID=$(security cms -D -i apps/mobile/distribution.mobileprovision | plutil -extract TeamIdentifier.0 raw -)
          BUNDLE_ID=$(security cms -D -i apps/mobile/distribution.mobileprovision | plutil -extract Entitlements.application-identifier raw - | sed "s/${TEAM_ID}\\.//")
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV
          echo "Team: $TEAM_ID, Bundle: $BUNDLE_ID"

      - name: Build iOS IPA with Xcode
        working-directory: apps/mobile/ios
        run: |
          # Find the scheme
          SCHEME=$(xcodebuild -list -json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['project']['schemes'][0])" 2>/dev/null || echo "namthanh-driver")
          echo "Using scheme: $SCHEME"

          # Create ExportOptions.plist
          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ env.TEAM_ID }}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.namthanh.driver</key>
              <string>${{ env.PP_UUID }}</string>
            </dict>
          </dict>
          </plist>
          EOF

          # Archive
          xcodebuild archive \
            -workspace *.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath /tmp/app.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PP_UUID }}" \
            DEVELOPMENT_TEAM="${{ env.TEAM_ID }}" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            -allowProvisioningUpdates \
            | xcpretty || true

          # Export IPA
          xcodebuild -exportArchive \
            -archivePath /tmp/app.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath /tmp/ipa_output \
            | xcpretty || true

          ls -lh /tmp/ipa_output/

      - name: Setup ASC API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Upload to TestFlight
        run: |
          IPA_PATH=$(find /tmp/ipa_output -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" \
            --verbose
